<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 320px;
  gap: 2rem;
}

#container-display {
  font-size: 22px;
  font-weight: 500;
  padding: 1.2rem 2.5rem;
  background: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 12px;
}

#counter-button {
  font-size: 16px;
  padding: 0.7rem 2.5rem;
  border-radius: 8px;
  border: 1px solid #ccc;
  cursor: pointer;
  transition: background 0.15s;
}

#counter-button:hover {
  background: #e0e0e0;
}
</style>
<body>
    <div class="container">
        <p id="container-display">click 0 times</p>
        <button id="counter-button" >click here</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
